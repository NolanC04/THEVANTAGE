# Automated pipeline: GitHub → Supabase → Vercel
#
# 1. checks   — typecheck, lint, tests, build (every push and PR).
# 2. database — applies supabase/migrations/* and supabase/config.toml auth
#               settings to the linked Supabase project. Runs only after checks pass,
#               and only when the three Supabase secrets below are set.
# 3. Vercel   — no job needed: Vercel's GitHub integration builds every push
#               (preview for branches, production for the Production Branch).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the id in your project URL (supabase.com/dashboard/project/<ref>)
#   SUPABASE_DB_PASSWORD   — the database password set when the project was created

name: Deploy

on:
  push:
    branches: [main, claude/nifty-mayer-5inp2o]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Supabase is not connected yet
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets not set; skipping migrations. See the header of this file."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 3.2.0
      - name: Link project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Apply migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Apply auth settings (site URL, magic-link redirects)
        if: steps.gate.outputs.ready == 'true'
        run: supabase config push --yes
